name: Build and Deploy Umami to Square Cloud

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Umami
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_TYPE: postgresql
          APP_SECRET: ${{ secrets.APP_SECRET }}
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm build

      - name: Prepare Standalone Deployment Package
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp squarecloud.app .next/standalone/
          
          # Preparar dependencias reales de ejecucion para Next.js, Prisma y Postgres
          rm -rf .next/standalone/node_modules
          mkdir -p .next/standalone/node_modules
          cp -rL node_modules/next node_modules/react node_modules/react-dom node_modules/semver .next/standalone/node_modules/
          
          for dir in node_modules/.pnpm/@prisma* node_modules/.pnpm/pg* node_modules/.pnpm/postgres* node_modules/.pnpm/@next+env* node_modules/.pnpm/@swc+helpers* node_modules/.pnpm/styled-jsx* node_modules/.pnpm/client-only* node_modules/.pnpm/split2* node_modules/.pnpm/xtend* node_modules/.pnpm/detect-libc*; do
            if [ -d "$dir/node_modules" ]; then
              cp -rL "$dir"/node_modules/* .next/standalone/node_modules/ 2>/dev/null || true
            fi
          done
          
          # Limpiar dependencias de desarrollo no usadas en ejecucion para mantener el paquete en 84MB
          rm -rf .next/standalone/node_modules/prisma .next/standalone/node_modules/typescript .next/standalone/node_modules/effect .next/standalone/node_modules/@electric-sql .next/standalone/node_modules/elkjs .next/standalone/node_modules/@prisma/engines* .next/standalone/node_modules/@next/swc* .next/standalone/geo
          find .next/standalone -name "*.map" -delete
          
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync(".next/standalone/package.json", "utf8"));
          pkg.scripts = {
            build: "echo already_built",
            start: "PORT=80 HOSTNAME=0.0.0.0 node server.js"
          };
          fs.writeFileSync(".next/standalone/package.json", JSON.stringify(pkg, null, 2));
          '
          
          cd .next/standalone
          zip -9rq ../../deploy.zip .

      - name: Deploy to Square Cloud
        env:
          SQUARECLOUD_API_KEY: ${{ secrets.SQUARECLOUD_API_KEY }}
          SQUARECLOUD_APP_ID: ${{ secrets.SQUARECLOUD_APP_ID }}
        run: |
          echo "Tamaño del archivo deploy.zip:"
          ls -lh deploy.zip
          echo "Subiendo paquete deploy.zip a Square Cloud..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: ${SQUARECLOUD_API_KEY}" \
            -F "file=@deploy.zip" \
            "https://api.squarecloud.app/v2/apps/${SQUARECLOUD_APP_ID}/commit")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "Despliegue exitoso en Square Cloud."
          else
            echo "Error al subir a Square Cloud."
            exit 1
          fi
